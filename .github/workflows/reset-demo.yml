name: Reset Demo

on:
  workflow_dispatch:
  schedule:
    # 01:00 UTC is 04:00 in Qatar
    - cron: "0 1 * * *"

permissions:
  contents: read

concurrency:
  # Shared with VM-deploy.yml so a reset never overlaps a deploy
  group: vm-deploy
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Recreate the OpenCode container
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_ADMIN }}
          password: ${{ secrets.ADMIN_PASSWORD }}
          script: |
            set -eu
            cd "$HOME/${{ secrets.REPO_NAME }}"
            # Sessions, opened projects, visitor folders and demo edits live only in the
            # container, so a fresh container from the current image starts clean.
            docker compose up -d --force-recreate --no-build
            curl --fail --retry 12 --retry-all-errors --retry-delay 5 --retry-connrefused http://127.0.0.1:4096/ > /dev/null
