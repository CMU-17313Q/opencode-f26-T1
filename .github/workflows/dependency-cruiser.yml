name: Dependency Cruiser

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-cruiser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-cruiser:
    name: Runtime import cycles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      - name: Verify the cycle rules
        run: |
          set -o pipefail
          bun run verify:dependencies 2>&1 | tee dependency-cruiser-verification.txt

      - name: Check OpenCode runtime imports
        run: |
          set -o pipefail
          bun run check:dependencies 2>&1 | tee dependency-cruiser-result.txt

      - name: Upload dependency check evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-cruiser-evidence
          path: |
            dependency-cruiser-verification.txt
            dependency-cruiser-result.txt
          if-no-files-found: ignore
          retention-days: 30
