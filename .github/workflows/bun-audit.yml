name: Bun Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bun-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Bun Audit
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Verify the baseline policy
        working-directory: script/ci
        run: bun test bun-audit.test.ts

      - name: Audit the repository lockfile against the approved baseline
        shell: bash
        run: |
          set -o pipefail
          bun --version
          bun run script/ci/bun-audit.ts 2>&1 | tee bun-audit-policy.txt

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bun-audit-evidence
          path: |
            bun-audit-results.json
            bun-audit-errors.txt
            bun-audit-summary.json
            bun-audit-policy.txt
          if-no-files-found: warn
          retention-days: 30
