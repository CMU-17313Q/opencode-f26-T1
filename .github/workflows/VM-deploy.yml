name: VM Deploy OpenCode

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vm-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_ADMIN }}
          password: ${{ secrets.ADMIN_PASSWORD }}
          command_timeout: 30m
          script: |
            set -eu
            cd "$HOME/${{ secrets.REPO_NAME }}"
            git pull --ff-only origin main
            docker compose up -d --build --remove-orphans
            curl --fail --retry 12 --retry-delay 5 --retry-connrefused http://127.0.0.1:4096/ > /dev/null
